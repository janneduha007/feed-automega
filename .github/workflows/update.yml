name: Update Automega feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"  # každou hodinu v :15 (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch supplier feed
        run: |
          mkdir -p tmp

          # víc "browser-like" hlaviček + cookies
          for i in 1 2 3; do
            curl -L --fail \
              --retry 3 --retry-delay 5 \
              --connect-timeout 20 --max-time 300 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: cs-CZ,cs;q=0.9,en;q=0.8" \
              -H "Referer: http://www.automega.cz/" \
              -H "Connection: keep-alive" \
              -c tmp/cookies.txt -b tmp/cookies.txt \
              "${{ secrets.AUTOMEGA_FEED_URL }}" \
              -o tmp/automega.xml && break
            echo "Retry $i failed, sleeping..."
            sleep 10
          done

          # kontrola, že něco přišlo
          test -s tmp/automega.xml
          echo "Downloaded $(wc -c < tmp/automega.xml) bytes"
          head -n 5 tmp/automega.xml || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update output + snapshot
        env:
          AUTOMEGA_FEED_FILE: tmp/automega.xml
        run: |
          python tools/update_automega_feed.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/automega.xml data/automega_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Automega feed"
          git push
