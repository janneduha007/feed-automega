name: Update Automega feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"  # každou hodinu v :15 (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure temp dir
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null

      - name: Install Playwright (if needed)
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          py -V:3.14 -m pip install --upgrade pip
          py -V:3.14 -m pip install playwright
          py -V:3.14 -m playwright install chromium

      - name: Fetch supplier feed
        shell: powershell
        working-directory: ${{ github.workspace }}
        env:
          AUTOMEGA_FEED_URL: ${{ secrets.AUTOMEGA_FEED_URL }}
          AUTOMEGA_FEED_FILE: tmp/automega.xml
        run: |
          py -V:3.14 tools/fetch_automega_feed.py

          $outFile = "tmp/automega.xml"
          $size = (Get-Item $outFile).Length
          Write-Host ("Downloaded {0} bytes" -f $size)

          $head = (Get-Content $outFile -TotalCount 60) -join "`n"
          if ($head -notmatch "<SHOP") {
            Write-Host "ERROR: Not XML feed. First 500 chars:"
            $preview = $head.Substring(0, [Math]::Min(500, $head.Length))
            Write-Host $preview
            throw "Downloaded file is not the expected XML feed."
          }

      - name: Update output + snapshot
        shell: powershell
        working-directory: ${{ github.workspace }}
        env:
          AUTOMEGA_FEED_FILE: tmp/automega.xml
        run: |
          py -V:3.14 tools/update_automega_feed.py

      - name: Commit changes (if any)
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          # Fix "dubious ownership" on self-hosted runner
          git config --global --add safe.directory "${{ github.workspace }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add feeds/automega.xml data/automega_snapshot.json

          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "No changes"
            exit 0
          }

          git commit -m "Update Automega feed"
          git push
