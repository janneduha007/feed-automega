name: Update Automega feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"  # každou hodinu v :15 (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch supplier feed
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null

          $url = "${{ secrets.AUTOMEGA_FEED_URL }}"
          $headers = @{
            "User-Agent"      = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
            "Accept"          = "application/xml,text/xml,*/*;q=0.8"
            "Accept-Language" = "cs-CZ,cs;q=0.9,en;q=0.8"
            "Referer"         = "http://www.automega.cz/"
          }

          $outFile = "tmp/automega.xml"

          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Write-Host "Download attempt $i..."
              Invoke-WebRequest -Uri $url -Headers $headers -OutFile $outFile -TimeoutSec 300

              if ((Test-Path $outFile) -and ((Get-Item $outFile).Length -gt 0)) {
                $ok = $true
                break
              }
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }

          if (-not $ok) {
            throw "Download failed after 3 attempts."
          }

          Write-Host ("Downloaded {0} bytes" -f (Get-Item $outFile).Length)
          Get-Content $outFile -TotalCount 5 | ForEach-Object { Write-Host $_ }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update output + snapshot
        shell: powershell
        env:
          AUTOMEGA_FEED_FILE: tmp/automega.xml
        run: |
          python tools/update_automega_feed.py

      - name: Commit changes (if any)
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add feeds/automega.xml data/automega_snapshot.json

          $diff = git diff --cached --name-only
          if ([string]::IsNullOrWhiteSpace($diff)) {
            Write-Host "No changes to commit."
            exit 0
          }

          git commit -m "Update Automega feed"
          git push
